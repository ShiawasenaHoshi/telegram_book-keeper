name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Dependency and SAST scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scan tools
        run: pip install -r requirements.txt bandit pip-audit

      - name: pip-audit (fail on known CVEs in requirements)
        run: pip-audit -r requirements.txt

      - name: bandit (fail on HIGH severity in app code)
        run: bandit -r app config.py -lll
